name: Publish Prompts Oficina Studio (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prompts-oficina-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Validate prompts and static showroom
        run: |
          node --check showcase/studio.mjs
          node --check showcase/manifest.mjs
          node --check showcase/prompt-utils.mjs
          node --test showcase/tests/*.test.mjs
      - name: Stage original Markdown assets and studio
        run: |
          mkdir -p _site/prompts
          cp showcase/index.html showcase/studio.css showcase/studio.mjs showcase/manifest.mjs showcase/prompt-utils.mjs showcase/robots.txt showcase/sitemap.xml _site/
          cp prompts/[0-9][0-9]-*.md _site/prompts/
          cp prompts/PROMPTS_COMPLETOS.txt _site/prompts/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
